<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareCloud Patient Registry</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; color: #1a1a1a; background: #f5f5f5; }
  header { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 16px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 18px; font-weight: 600; flex: 1; }
  .search-row { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type="text"] { border: 1px solid #ccc; border-radius: 4px; padding: 6px 10px; font-size: 13px; width: 180px; }
  input[type="text"]:focus { outline: none; border-color: #0066cc; }
  button { background: #0066cc; color: #fff; border: none; border-radius: 4px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
  button:hover { background: #0052a3; }
  button.clear { background: #6c757d; }
  button.clear:hover { background: #545b62; }
  main { padding: 24px; }
  .state { text-align: center; padding: 48px; color: #666; }
  .state.error { color: #c0392b; }
  .count { font-size: 12px; color: #666; margin-bottom: 12px; }
  .table-wrap { overflow-x: auto; background: #fff; border: 1px solid #e0e0e0; border-radius: 6px; }
  table { width: 100%; border-collapse: collapse; }
  th { background: #f8f8f8; text-align: left; padding: 10px 12px; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: #555; border-bottom: 1px solid #e0e0e0; white-space: nowrap; }
  td { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafafa; }
  .mono { font-family: "SF Mono", "Fira Code", monospace; font-size: 12px; }
  .badge { display: inline-block; padding: 2px 7px; border-radius: 10px; font-size: 11px; background: #e8f0fe; color: #1a56db; }
</style>
</head>
<body>
<header>
  <h1>CareCloud Patient Registry</h1>
  <div class="search-row">
    <input type="text" id="q-name" placeholder="Last name" />
    <input type="text" id="q-phone" placeholder="Phone number" />
    <button onclick="search()">Search</button>
    <button class="clear" onclick="clearSearch()">Clear</button>
  </div>
</header>
<main>
  <div id="state" class="state">Loading…</div>
  <div id="count" class="count" hidden></div>
  <div id="table-wrap" class="table-wrap" hidden>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>DOB</th>
          <th>Sex</th>
          <th>Phone</th>
          <th>City / State</th>
          <th>ZIP</th>
          <th>Insurance</th>
          <th>Created</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</main>
<script>
  function fmt(phone) {
    if (!phone || phone.length !== 10) return phone ?? '—';
    return `(${phone.slice(0,3)}) ${phone.slice(3,6)}-${phone.slice(6)}`;
  }
  function fmtDate(iso) {
    if (!iso) return '—';
    const [y, m, d] = iso.slice(0,10).split('-');
    return `${m}/${d}/${y}`;
  }
  function fmtCreated(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' });
  }
  function esc(s) {
    if (!s) return '—';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function load(params = {}) {
    const stateEl = document.getElementById('state');
    const tableWrap = document.getElementById('table-wrap');
    const countEl = document.getElementById('count');
    stateEl.className = 'state';
    stateEl.textContent = 'Loading…';
    stateEl.hidden = false;
    tableWrap.hidden = true;
    countEl.hidden = true;

    const qs = new URLSearchParams();
    if (params.last_name) qs.set('last_name', params.last_name);
    if (params.phone_number) qs.set('phone_number', params.phone_number);
    const url = '/patients' + (qs.toString() ? '?' + qs : '');

    let data;
    try {
      const res = await fetch(url);
      const json = await res.json();
      if (!res.ok || json.error) throw new Error(json.error?.message ?? `HTTP ${res.status}`);
      data = json.data;
    } catch (e) {
      stateEl.className = 'state error';
      stateEl.textContent = 'Error loading patients: ' + e.message;
      return;
    }

    if (!data.length) {
      stateEl.textContent = 'No patients found.';
      return;
    }

    stateEl.hidden = true;
    countEl.textContent = `${data.length} patient${data.length !== 1 ? 's' : ''}`;
    countEl.hidden = false;

    const tbody = document.getElementById('tbody');
    tbody.innerHTML = data.map(p => `
      <tr>
        <td><strong>${esc(p.first_name)} ${esc(p.last_name)}</strong></td>
        <td>${fmtDate(p.date_of_birth)}</td>
        <td><span class="badge">${esc(p.sex)}</span></td>
        <td class="mono">${fmt(p.phone_number)}</td>
        <td>${esc(p.city)}, ${esc(p.state)}</td>
        <td class="mono">${esc(p.zip_code)}</td>
        <td>${esc(p.insurance_provider)}${p.insurance_member_id ? ' <span class="mono">'+esc(p.insurance_member_id)+'</span>' : ''}</td>
        <td>${fmtCreated(p.created_at)}</td>
      </tr>`).join('');
    tableWrap.hidden = false;
  }

  function search() {
    load({
      last_name: document.getElementById('q-name').value.trim(),
      phone_number: document.getElementById('q-phone').value.trim(),
    });
  }

  function clearSearch() {
    document.getElementById('q-name').value = '';
    document.getElementById('q-phone').value = '';
    load();
  }

  document.getElementById('q-name').addEventListener('keydown', e => e.key === 'Enter' && search());
  document.getElementById('q-phone').addEventListener('keydown', e => e.key === 'Enter' && search());

  load();
</script>
</body>
</html>
